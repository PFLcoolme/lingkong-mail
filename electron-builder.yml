appId: com.kongling.mail
productName: 空灵邮箱
copyright: Copyright © 2026 cool
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - build/**/*
  - package.json
asar: true
compression: maximum
linux:
  executableName: kongling-mail
  # 兜底产物名：tar.gz 这类没有独立配置段的 target 会用它
  # （AppImage / deb 各自有专属段，优先级更高，不受此影响）
  artifactName: kongling-mail-${version}-${arch}.${ext}
  category: Network;Email;
  desktop:
    entry:
      MimeType: "x-scheme-handler/mailto;"
  maintainer: cool
  icon: build/icon.png
  synopsis: 本地桌面邮箱管理客户端
  description: 支持 IMAP/SMTP/POP3/OAuth2/Exchange 的本地邮箱管理软件
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    # tar.gz 供 Flatpak / Flathub 打包使用（清单见 packaging/flatpak/）
    - target: tar.gz
      arch:
        - x64
appImage:
  # 资产名必须与 latest-linux.yml 中记录的一致，自动更新才能定位到安装包；
  # 用中文 productName 会让下载链接变成一长串百分号编码，故固定为英文名
  artifactName: kongling-mail-${version}-${arch}.${ext}
deb:
  artifactName: kongling-mail-${version}-${arch}.${ext}
# 注意：不要写顶层 tarGz: 段 —— electron-builder 的配置 schema 里没有这个键，
# 会直接报 Invalid configuration object。tar.gz 的产物名由上面的 linux.artifactName 决定。
# electron-updater 通过这里生成 app-update.yml / latest-linux.yml
publish:
  provider: github
  owner: PFLcoolme
  repo: lingkong-mail
  releaseType: release
# 原生模块（better-sqlite3）由本机或 CI 显式跑 electron-rebuild 处理，不在打包时重编译
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
