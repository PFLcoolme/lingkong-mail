name: Release

# 推送 v* 标签时自动构建并发布到 GitHub Release；
# 也可以在 Actions 页面手动触发（不传 tag 时只构建、不发布）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        # better-sqlite3 必须针对 Electron 的 ABI 重编译，否则应用启动即报错
        run: npm run rebuild

      - name: Type check
        run: npm run typecheck

      - name: Build renderer & main
        run: npm run build

      - name: Package and publish
        # GH_TOKEN 由 Actions 提供；--publish always 会创建/更新对应 tag 的 Release
        # 并上传 latest-linux.yml（自动更新的版本清单）
        run: npx electron-builder --linux AppImage deb --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kongling-mail-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: warn
