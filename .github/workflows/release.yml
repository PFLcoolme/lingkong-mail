name: Release

# 推送 v* 标签时自动构建并发布到 GitHub Release；
# 也可以在 Actions 页面手动触发（不传 tag 时只构建、不发布）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        # better-sqlite3 必须针对 Electron 的 ABI 重编译，否则应用启动即报错
        run: npm run rebuild

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build renderer & main
        run: npm run build

      - name: Package (manual run, no publish)
        # yml 里存在 publish 配置，必须显式 --publish never，
        # 否则 electron-builder 仍会尝试建立 publisher 并因缺少 GH_TOKEN 报错
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Package and publish (tag push)
        # GH_TOKEN 由 Actions 提供；--publish always 会创建/更新对应 tag 的 Release
        # 并上传 latest-linux.yml（自动更新的版本清单）
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --linux AppImage deb --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tidy release title and notes
        if: startsWith(github.ref, 'refs/tags/')
        # electron-builder 建出的 Release 标题就是 tag 名、且没有说明。
        # 注意 gh release edit 并不支持 --generate-notes（那是 release create 的参数），
        # 所以这里直接取 tag 指向提交的说明作为发布文案。
        run: gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --latest --notes "$(git log -1 --pretty=%B)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print package checksums
        # AUR 的 PKGBUILD 与 Flatpak 清单都需要安装包的 sha256。
        # 在这里直接对刚打好的产物求值并写进构建摘要，省去本地下载上百 MB 的包。
        if: always()
        run: |
          {
            echo '### 安装包校验和'
            echo ''
            echo '```'
            for f in dist/*.AppImage dist/*.deb dist/*.tar.gz; do
              if [ -e "$f" ]; then sha256sum "$f"; fi
            done
            echo '```'
            echo ''
            echo '将上述 sha256 填入 `packaging/aur/PKGBUILD` 与'
            echo '`packaging/flatpak/com.kongling.mail.yml` 后提交。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts to workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kongling-mail-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: warn
